apiVersion: v1
kind: Service
metadata:
  name: configurator-lob
  namespace: prod
  labels:
    app: configurator-lob
spec:
  # Mismo patron que laurel-infra-manager: LoadBalancer publicado por IP del
  # nodo (192.168.20.240), sin Ingress. El frontend queda en 3007 y apunta al
  # backend de laurel en http://192.168.20.240:3006.
  type: LoadBalancer
  selector:
    app: configurator-lob
  ports:
    - name: http
      port: 3007
      nodePort: 3007
      targetPort: http