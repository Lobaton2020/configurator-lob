server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: fallback al index.html para las rutas del router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash: cache largo e inmutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}